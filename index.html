<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MangaFlow FR</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #10121a; color: #f4f4f8;
    font: 16px system-ui, sans-serif;
  }
  main { max-width: 650px; margin: auto; }
  h1 { color: #a78bfa; }
  input, button, textarea {
    width: 100%; padding: 13px; margin: 7px 0;
    border-radius: 10px; border: 1px solid #414457;
    background: #202332; color: white; font: inherit;
  }
  button { background: #7c3aed; border: 0; font-weight: 700; }
  button:disabled { opacity: .5; }
  .panel {
    background: #191c28; padding: 15px;
    border-radius: 14px; margin: 16px 0;
  }
  #status { color: #c4b5fd; white-space: pre-wrap; }
  #result { white-space: pre-wrap; line-height: 1.7; }
  img { max-width: 100%; border-radius: 8px; }
  small { color: #b9bdcc; }
</style>
</head>
<body>
<main>
  <h1>📚 MangaFlow FR</h1>
  <p>Ton laboratoire de traduction de manhwa.</p>

  <section class="panel">
    <h3>1. Chapitre</h3>
    <input id="chapterUrl" type="url"
      placeholder="https://site-exemple.com/chapitre-1">
    <button id="openUrl">Ouvrir le chapitre source</button>
    <small>La récupération automatique des pages sera ajoutée
    pour un site source compatible.</small>
  </section>

  <section class="panel">
    <h3>2. Importer les pages</h3>
    <input id="images" type="file"
      accept="image/png,image/jpeg,image/webp"
      multiple>
    <div id="previews"></div>
  </section>

  <section class="panel">
    <h3>3. Traduction</h3>
    <label for="api">Adresse de l'API LibreTranslate</label>
    <input id="api" type="url"
      value="https://libretranslate.com/translate">
    <label for="key">Clé API (si nécessaire)</label>
    <input id="key" type="password"
      placeholder="Laisse vide si non nécessaire">
    <label for="lang">Langue du texte original</label>
    <select id="lang">
      <option value="eng">Anglais</option>
      <option value="kor">Coréen</option>
      <option value="chi_sim">Chinois simplifié</option>
    </select>
    <button id="run">Reconnaître et traduire</button>
    <p id="status">En attente de pages.</p>
  </section>

  <section class="panel">
    <h3>4. Résultat français</h3>
    <div id="result">La traduction apparaîtra ici.</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let files = [];

$("openUrl").onclick = () => {
  const raw = $("chapterUrl").value.trim();
  try {
    const u = new URL(raw);
    if (!["http:", "https:"].includes(u.protocol)) throw Error();
    window.open(u.href, "_blank", "noopener,noreferrer");
  } catch {
    $("status").textContent = "Entre une URL HTTP ou HTTPS valide.";
  }
};

$("images").onchange = e => {
  files = Array.from(e.target.files || []);
  $("previews").replaceChildren();
  files.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.alt = file.name;
    $("previews").append(img);
  });
  $("status").textContent = files.length
    ? files.length + " page(s) prête(s)." : "Aucune page choisie.";
};

async function translate(text) {
  const endpoint = $("api").value.trim();
  const url = new URL(endpoint);
  if (url.protocol !== "https:") {
    throw Error("Utilise une API HTTPS.");
  }

  const body = {
    q: text,
    source: "auto",
    target: "fr",
    format: "text"
  };
  if ($("key").value.trim()) body.api_key = $("key").value.trim();

  const response = await fetch(url.href, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) throw Error(
    "API de traduction : erreur HTTP " + response.status
  );
  const data = await response.json();
  if (!data.translatedText) throw Error("Réponse de traduction invalide.");
  return data.translatedText;
}

$("run").onclick = async () => {
  if (!files.length) {
    $("status").textContent = "Importe d'abord une ou plusieurs images.";
    return;
  }

  $("run").disabled = true;
  $("result").textContent = "";
  const allResults = [];

  try {
    const language = $("lang").value;
    const worker = await Tesseract.createWorker(language, 1, {
      logger: m => {
        if (m.status) {
          $("status").textContent =
            m.status + (m.progress != null
              ? " : " + Math.round(m.progress * 100) + "%" : "");
        }
      }
    });

    for (let i = 0; i < files.length; i++) {
      $("status").textContent =
        "Lecture de la page " + (i + 1) + "/" + files.length;

      const { data } = await worker.recognize(files[i]);
      const text = data.text.trim();

      if (!text) {
        allResults.push("Page " + (i + 1) +
          "\nAucun texte reconnu.");
        continue;
      }

      // Évite d'envoyer une page entière dans une seule requête.
      const chunks = text.match(/[\s\S]{1,1200}/g) || [];
      const translated = [];
      for (const chunk of chunks) {
        translated.push(await translate(chunk));
      }

      allResults.push("PAGE " + (i + 1) + "\n" +
        translated.join("\n"));
      $("result").textContent = allResults.join("\n\n");
    }

    await worker.terminate();
    $("status").textContent = "Traitement terminé.";
  } catch (error) {
    $("status").textContent =
      "Erreur : " + error.message +
      "\nVérifie la connexion, les langues OCR et l'API.";
  } finally {
    $("run").disabled = false;
  }
};
</script>
</body>
</html>
