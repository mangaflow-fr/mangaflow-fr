<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MangaFlow FR — Traduction</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#10121a;color:#f4f4f8;font:16px system-ui,sans-serif}
main{max-width:760px;margin:auto}
h1{color:#a78bfa}
.panel{background:#191c28;padding:16px;border-radius:14px;margin:16px 0}
label{display:block;margin:12px 0 5px;color:#ddd6fe}
input,button,textarea,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #414457;background:#202332;color:white;font:inherit}
textarea{min-height:220px;line-height:1.55;resize:vertical}
button{background:#7c3aed;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55}
small{color:#b9bdcc}
#status{color:#c4b5fd;white-space:pre-wrap;overflow-wrap:anywhere}
#result{min-height:140px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){body{padding:12px}.row{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<main>
<h1>📚 MangaFlow FR</h1>
<p>Version de test : colle un texte ou importe un fichier .txt pour le traduire.</p>

<section class="panel">
<h3>1. Texte à traduire</h3>
<label for="textFile">Importer un fichier texte (.txt)</label>
<input id="textFile" type="file" accept=".txt,text/plain">
<label for="sourceText">Ou colle ton texte ici</label>
<textarea id="sourceText" placeholder="Colle ici le texte à traduire…"></textarea>
<small id="charCount">0 caractère</small>
</section>

<section class="panel">
<h3>2. Paramètres</h3>
<label for="api">Adresse de l'API LibreTranslate</label>
<input id="api" type="url" value="https://libretranslate.com/translate">
<label for="key">Clé API (si nécessaire)</label>
<input id="key" type="password" placeholder="Laisse vide si tu n'as pas de clé">
<div class="row">
<div>
<label for="lang">Langue originale</label>
<select id="lang">
<option value="en">Anglais</option>
<option value="ko">Coréen</option>
<option value="zh">Chinois</option>
<option value="auto">Détection automatique</option>
</select>
</div>
<div>
<label for="target">Langue de destination</label>
<select id="target">
<option value="fr">Français</option>
<option value="en">Anglais</option>
<option value="es">Espagnol</option>
</select>
</div>
</div>
<button id="run" type="button">Traduire le texte</button>
<p id="status" role="status" aria-live="polite">Prêt. Aucun texte envoyé.</p>
</section>

<section class="panel">
<h3>3. Résultat</h3>
<div id="result">La traduction apparaîtra ici.</div>
<button id="copy" type="button">Copier la traduction</button>
</section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);

$("textFile").addEventListener("change", async () => {
  const file = $("textFile").files[0];
  if (!file) return;
  try {
    $("sourceText").value = await file.text();
    updateCount();
    $("status").textContent = "Fichier chargé : " + file.name;
  } catch {
    $("status").textContent = "Impossible de lire ce fichier. Essaie un fichier .txt.";
  }
});

function updateCount() {
  const n = $("sourceText").value.length;
  $("charCount").textContent = n.toLocaleString("fr-FR") +
    (n > 1 ? " caractères" : " caractère");
}
$("sourceText").addEventListener("input", updateCount);
updateCount();

function splitText(text, maxLength = 1200) {
  const chunks = [];
  let remaining = text.trim();
  while (remaining.length > maxLength) {
    let cut = remaining.lastIndexOf("\n", maxLength);
    if (cut < maxLength * 0.5) cut = remaining.lastIndexOf(" ", maxLength);
    if (cut < maxLength * 0.5) cut = maxLength;
    chunks.push(remaining.slice(0, cut).trim());
    remaining = remaining.slice(cut).trim();
  }
  if (remaining) chunks.push(remaining);
  return chunks;
}

async function translateChunk(text) {
  let url;
  try {
    url = new URL($("api").value.trim());
  } catch {
    throw new Error("L'adresse de l'API est invalide.");
  }
  if (url.protocol !== "https:") {
    throw new Error("Utilise une adresse HTTPS.");
  }

  const body = {
    q: text,
    source: $("lang").value,
    target: $("target").value,
    format: "text"
  };
  const key = $("key").value.trim();
  if (key) body.api_key = key;

  let response;
  try {
    response = await fetch(url.href, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
  } catch {
    throw new Error("Connexion impossible. Vérifie Internet, l'adresse de l'API ou ses autorisations CORS.");
  }

  const raw = await response.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    data = {error: raw};
  }

  if (!response.ok) {
    const detail = typeof data.error === "string" ? data.error : raw;
    throw new Error("Erreur HTTP " + response.status + " : " +
      (detail || "le serveur a refusé la requête."));
  }
  if (typeof data.translatedText !== "string") {
    throw new Error("Réponse inattendue : la traduction est absente.");
  }
  return data.translatedText;
}
